name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  check:
    name: Verify (mirrors the local pre-commit gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Dependency tree check
        run: npm run deps:check

      - name: Security audit
        run: npm run audit:check

      - name: Typecheck
        run: npm run typecheck

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
